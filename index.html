<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>엑셀 헤더 설정 및 행·열 골라 추출하기</title>
  <script type="module" crossorigin src="./assets/index-DcRQ_6JB.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CVTf0Cag.css">
</head>
<body>

<div class="wrap">

  <header class="card">
    <h1>📊 엑셀 헤더 설정 및 맞춤 데이터 추출기</h1>
    <p class="lead">
      행·열 개수를 정해 헤더 범위를 설정하고, 필요한 데이터만 체크해서 새 엑셀 파일로 받으세요.
      헤더 칸이 병합돼 있으면 상위·하위 이름을 자동으로 이어 붙입니다 (예: <b>인구 &gt; 남</b>).
    </p>
    <p class="muted">파일은 인터넷으로 보내지 않고, 이 컴퓨터의 브라우저 안에서만 처리됩니다.</p>
  </header>

  <section class="card">
    <label class="dropzone" id="dropzone" for="fileInput">
      <span class="dz-icon" aria-hidden="true">📂</span>
      <span class="dz-text" id="dzText">클릭하거나 파일을 끌어다 놓아 엑셀(.xlsx, .xls, .csv)을 선택하세요</span>
    </label>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" class="sr-only">
    <div id="fileError"></div>
  </section>

  <section class="card" id="configCard" hidden>
    <div class="config-box">
      <div class="config-field">
        <label for="headerRowSelect">헤더로 쓸 행 개수</label>
        <select id="headerRowSelect"></select>
      </div>
      <div class="config-field">
        <label for="headerColSelect">헤더(이름표)로 쓸 열 — 여기까지</label>
        <select id="headerColSelect"></select>
      </div>
      <span class="muted" id="sheetInfo"></span>
    </div>
    <div id="mergeNotice"></div>
  </section>

  <section class="card" id="pickCard" hidden>
    <div class="pick-columns">

      <div class="pick-col">
        <h2>① 추출할 속성(열) 선택</h2>
        <input type="search" class="search-input" id="colSearch" placeholder="🔍 속성 이름 찾기">
        <div class="controls">
          <div class="btn-row">
            <button type="button" class="btn-sm" id="colAll">전체 선택</button>
            <button type="button" class="btn-sm" id="colNone">전체 해제</button>
          </div>
          <span class="badge" id="colCount">0 / 0개 선택됨</span>
        </div>
        <div class="checkbox-grid" id="colContainer"></div>
      </div>

      <div class="pick-col">
        <h2>② 추출할 자료(행) 선택</h2>
        <input type="search" class="search-input" id="rowSearch" placeholder="🔍 자료 찾기">
        <div class="controls">
          <div class="btn-row">
            <button type="button" class="btn-sm" id="rowAll">전체 선택</button>
            <button type="button" class="btn-sm" id="rowNone">전체 해제</button>
          </div>
          <span class="badge" id="rowCount">0 / 0개 선택됨</span>
        </div>
        <div class="checkbox-grid" id="rowContainer"></div>
      </div>

    </div>

    <!-- 미리보기 화면은 당분간 꺼 둔다 (요청에 따라 주석 처리)
    <div class="preview-wrap">
      <h2>미리보기 (앞 20행)</h2>
      <div class="table-box" id="previewBox"></div>
    </div>
    -->

    <div class="save-row">
      <input type="text" id="saveName" class="text-input" placeholder="파일 이름">
      <button type="button" class="btn" id="downloadBtn">📥 선택한 데이터 엑셀로 받기</button>
    </div>
    <div id="saveResult"></div>
  </section>

</div>

</body>
</html>
