<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중학교 정보 수업 활동</title>
<meta name="description" content="2022 개정 교육과정 중학교 정보 5개 단원별 수업 활동 모음">
<!-- 주소창·탭에 뜨는 아이콘. encosn 의 머리글자 e 를 그린 것이다.
     svg 를 먼저 두어 최신 브라우저는 벡터로 또렷하게 쓰고,
     svg 를 모르는 브라우저는 아래 png 로 넘어간다. -->
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="icon" href="./favicon.png" sizes="32x32" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="wrap">

  <header class="site-head">
    <h1 id="siteTitle">중학교 정보 수업 활동</h1>
    <p class="sub" id="siteSub">단원을 골라 들어가면 그 단원에서 해 볼 수 있는 활동이 나와요.</p>
  </header>

  <!-- 단원 카드 5개는 data.js 를 읽어 app.js 가 그린다 -->
  <div class="unit-grid" id="unitGrid"></div>

  <h2 class="section-title">🧑‍🏫 선생님용 도구</h2>
  <div class="act-list" id="toolList"></div>

  <footer class="site-foot">
    <p>2022 개정 교육과정 「[별책3] 중학교 교육과정」 정보 과목의 5개 영역을 단원으로 삼았습니다.</p>
    <p>모든 활동은 브라우저 안에서만 동작하며, 학생의 개인정보를 수집하거나 저장하지 않습니다.</p>
  </footer>

</div>

<!-- data.js 는 활동 목록이라 자주 고친다. 그런데 깃허브 페이지가 이 파일에
     10분짜리 캐시를 붙이므로, 고쳐 올린 직후에 열면 예전 목록이 그대로 보인다.
     수업 직전에 활동을 하나 더 올렸는데 화면에 안 나오는 일이 실제로 있었다.
     그래서 주소 뒤에 그때그때 다른 값을 붙여 늘 새로 받게 한다.
     data.js 는 13KB 라 매번 새로 받아도 부담이 없다.
     app.js 는 data.js 를 읽으므로 반드시 그다음에 불러야 한다. -->
<script>
  (function () {
    function load(src, onload) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = onload;
      document.body.appendChild(s);
    }
    load('./data.js?v=' + Date.now(), function () { load('./app.js'); });
  })();
</script>
</body>
</html>
