<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5단원 디지털 문화 — 중학교 정보 수업 활동</title>
<!-- 주소창·탭에 뜨는 아이콘. encosn 의 머리글자 e 를 그린 것이다.
     svg 를 먼저 두어 최신 브라우저는 벡터로 또렷하게 쓰고,
     svg 를 모르는 브라우저는 아래 png 로 넘어간다. -->
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="icon" href="./favicon.png" sizes="32x32" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<!-- data-unit 값이 몇 단원을 그릴지 정한다. 나머지는 5개 파일이 모두 같다 -->
<body data-unit="5">

<div class="wrap">

  <a class="back" href="./index.html">← 단원 고르기로</a>

  <header class="unit-head">
    <h1 id="unitTitle">5단원 · 디지털 문화</h1>
    <p class="sub" id="unitSummary"></p>
  </header>

  <h2 class="section-title">🙌 해 볼 수 있는 활동</h2>
  <div id="actArea"></div>

  <h2 class="section-title">🎯 이 단원의 성취기준</h2>
  <ul class="std-list" id="stdList"></ul>

  <footer class="site-foot">
    <p>2022 개정 교육과정 「[별책3] 중학교 교육과정」 정보 과목 (인쇄 277~282쪽) 기준</p>
  </footer>

</div>

<!-- data.js 는 활동 목록이라 자주 고친다. 그런데 깃허브 페이지가 이 파일에
     10분짜리 캐시를 붙이므로, 고쳐 올린 직후에 열면 예전 목록이 그대로 보인다.
     수업 직전에 활동을 하나 더 올렸는데 화면에 안 나오는 일이 실제로 있었다.
     그래서 주소 뒤에 그때그때 다른 값을 붙여 늘 새로 받게 한다.
     data.js 는 13KB 라 매번 새로 받아도 부담이 없다.
     app.js 는 data.js 를 읽으므로 반드시 그다음에 불러야 한다. -->
<script>
  (function () {
    function load(src, onload) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = onload;
      document.body.appendChild(s);
    }
    load('./data.js?v=' + Date.now(), function () { load('./app.js'); });
  })();
</script>
</body>
</html>
